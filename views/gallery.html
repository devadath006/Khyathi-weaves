<section class="max-w-7xl mx-auto px-6 py-12" 
         x-data="{ gallery: [], activeFilter: 'All', lightbox: false, currentItem: null }"
         x-init="fetch('/api/gallery').then(r=>r.json()).then(d=>gallery=d)">
    
    <div class="text-center mb-12">
        <h2 class="text-4xl font-serif font-bold text-stone-900 uppercase tracking-widest">Gallery</h2>
        <p class="text-stone-500 italic mt-2 text-sm">A technical showcase of Khyathi Weaves Story.</p>
        <div class="w-16 h-1 bg-rose-800 mx-auto mt-4"></div>
    </div>

    

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
        <template x-for="item in gallery" :key="item.id">
            <div x-show="activeFilter === 'All' || item.category === activeFilter"
                 x-transition:enter="transition ease-out duration-300"
                 @click="currentItem = item; lightbox = true"
                 class="bg-white border border-stone-100 rounded-2xl overflow-hidden shadow-xs cursor-pointer hover:shadow-lg transition-all group">
                
                <div class="aspect-square bg-stone-50 overflow-hidden relative">
                    <img :src="item.media_url" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                    <div class="absolute inset-0 bg-stone-900/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-6">
                        <span class="text-white text-xs font-bold tracking-widest uppercase bg-rose-800/90 px-3 py-1.5 rounded">View Full Image</span>
                    </div>
                </div>

                <div class="p-5 border-t border-stone-50">
                    <span class="text-[10px] font-mono tracking-widest uppercase bg-stone-100 text-stone-600 px-2 py-0.5 rounded" x-text="item.category"></span>
                    <h3 class="font-serif font-bold text-lg text-stone-900 mt-2" x-text="item.title"></h3>
                    <p class="text-stone-500 text-xs mt-1 line-clamp-2" x-text="item.description"></p>
                </div>
            </div>
        </template>
    </div>

    <div class="fixed inset-0 bg-black/90 z-[70] flex flex-col items-center justify-center p-4" 
         x-show="lightbox" 
         x-cloak 
         x-transition
         @keydown.escape.window="lightbox = false">
        
        <div class="absolute inset-0 cursor-zoom-out" @click="lightbox = false"></div>

        <div class="relative max-w-4xl max-h-[80vh] z-10 flex flex-col items-center" @click.away="lightbox = false">
            
            <button @click="lightbox = false" class="absolute -top-12 right-0 text-white hover:text-stone-300 font-mono text-sm tracking-widest uppercase flex items-center gap-2 cursor-pointer bg-stone-900/80 px-4 py-2 rounded-xl border border-stone-700">
                Close <i class="fa-solid fa-xmark"></i>
            </button>

            <img :src="currentItem?.media_url" class="rounded-xl max-w-full max-h-[80vh] object-contain shadow-2xl border border-stone-800">
            
            <div class="text-center mt-4 text-stone-300 max-w-xl">
                <h4 class="font-serif font-bold text-lg text-white" x-text="currentItem?.title"></h4>
            </div>
        </div>
    </div>
</section>
